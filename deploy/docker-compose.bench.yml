# Comparative benchmark cluster, driven by `relay-bench compare`. One
# profile per backend:
#
#   redis   Relay on Redis: redis + 1 coordinator + workers
#   raft    Relay on Raft:  3 coordinators + workers
#   asynq   github.com/hibiken/asynq: redis + asynq servers
#
# Both Redis deployments use the same configuration (AOF, fsync every
# second). Workers and the load driver record handler start/end and submit
# times into one history directory, all on the Docker VM's clock.
name: relaybench

x-relay-image: &relay-image
  image: ${BENCH_IMAGE:-relay:dev}

x-coordinator-env: &coordinator-env
  RELAY_LOG_LEVEL: warn

x-raft-env: &raft-env
  <<: *coordinator-env
  RELAY_STORE: raft
  RELAY_BOOTSTRAP: "true"
  RELAY_PEERS: n1=coord1:7000=coord1:50051,n2=coord2:7000=coord2:50051,n3=coord3:7000=coord3:50051

x-coordinator: &coordinator
  <<: *relay-image
  command: ["coordinator"]
  healthcheck:
    test: ["CMD", "relayctl", "--timeout", "1s", "health"]
    interval: 1s
    timeout: 2s
    retries: 60

services:
  redis:
    profiles: [redis, asynq]
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    ports: ["127.0.0.1::6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30

  coordinator:
    <<: *coordinator
    profiles: [redis]
    environment:
      <<: *coordinator-env
      RELAY_REDIS_ADDR: redis:6379
    ports: ["127.0.0.1::50051", "127.0.0.1::9090"]
    depends_on:
      redis: {condition: service_healthy}

  coord1:
    <<: *coordinator
    profiles: [raft]
    environment:
      <<: *raft-env
      RELAY_NODE_ID: n1
      RELAY_RAFT_ADVERTISE: coord1:7000
      RELAY_GRPC_ADVERTISE: coord1:50051
    volumes: ["coord1-data:/data"]
    ports: ["127.0.0.1::50051", "127.0.0.1::9090"]
  coord2:
    <<: *coordinator
    profiles: [raft]
    environment:
      <<: *raft-env
      RELAY_NODE_ID: n2
      RELAY_RAFT_ADVERTISE: coord2:7000
      RELAY_GRPC_ADVERTISE: coord2:50051
    volumes: ["coord2-data:/data"]
    ports: ["127.0.0.1::50051", "127.0.0.1::9090"]
  coord3:
    <<: *coordinator
    profiles: [raft]
    environment:
      <<: *raft-env
      RELAY_NODE_ID: n3
      RELAY_RAFT_ADVERTISE: coord3:7000
      RELAY_GRPC_ADVERTISE: coord3:50051
    volumes: ["coord3-data:/data"]
    ports: ["127.0.0.1::50051", "127.0.0.1::9090"]

  worker:
    <<: *relay-image
    profiles: [redis, raft]
    command: ["worker"]
    user: root
    environment:
      RELAY_COORDINATOR: ${BENCH_RELAY_TARGET:-coordinator:50051}
      RELAY_CONCURRENCY: ${BENCH_CONCURRENCY:-10}
      RELAY_HISTORY_DIR: /history
      RELAY_HISTORY_RPCS: ${BENCH_HISTORY_RPCS:-false}
      RELAY_LOG_LEVEL: warn
    volumes: ["${BENCH_HISTORY_DIR:?}:/history"]

  asynq-worker:
    <<: *relay-image
    profiles: [asynq]
    command: ["asynq-worker"]
    user: root
    environment:
      ASYNQ_REDIS_ADDR: redis:6379
      ASYNQ_CONCURRENCY: ${BENCH_CONCURRENCY:-10}
      ASYNQ_TASK_CHECK_INTERVAL: ${BENCH_ASYNQ_TASK_CHECK_INTERVAL:-0s}
      ASYNQ_HISTORY_DIR: /history
    volumes: ["${BENCH_HISTORY_DIR:?}:/history"]
    depends_on:
      redis: {condition: service_healthy}

  driver:
    <<: *relay-image
    profiles: [driver]
    entrypoint: ["relay-bench", "drive"]
    user: root
    volumes: ["${BENCH_HISTORY_DIR:?}:/history"]

volumes:
  coord1-data: {}
  coord2-data: {}
  coord3-data: {}
